# Configuração do pipeline_v2 (reestruturação do TG — Sistema Cantareira)
# Lido por 00_download_dados.py e 01_build_dataset_v2.py.

ano_inicial: 1984          # a série do SAR do Cantareira existe desde 1984-01-01
horizontes: [30, 60, 90]   # dias de antecedência dos alvos
limiar_crise: 30           # crise = volume útil do sistema (%) abaixo deste valor
limiar_crise_sensibilidade: 40   # limiar alternativo para análise de sensibilidade

# Detecção automática de episódios de crise (substitui o eventos.csv manual)
episodio_gap_max_dias: 60  # junta trechos < limiar separados por lacunas menores que isto
episodio_dur_min_dias: 30  # exige pelo menos esta duração para contar como episódio

# Marco regulatório: Resolução Conjunta ANA/DAEE nº 925, de 29/05/2017
pos_2017_data: "2017-05-29"

# Pontos da bacia (os 4 reservatórios do Sistema Cantareira). O clima da bacia
# é a média diária entre estes pontos, por variável e por fonte.
pontos:
  - {nome: "JAGUARI-JACAREI", lat: -22.9246, lon: -46.4270}
  - {nome: "CACHOEIRA",       lat: -23.0511, lon: -46.3200}
  - {nome: "ATIBAINHA",       lat: -23.1757, lon: -46.3936}
  - {nome: "PAIVA CASTRO",    lat: -23.3300, lon: -46.6795}

split:
  teste_inicio: "2023-01-01"      # teste INTOCÁVEL: 2023-01-01 até o fim (só abre com --abrir-teste)
  treino_fim: "2022-12-31"        # validação usa só 1984..2022
  folds:                          # janela crescente: treina com tudo que vem antes de 'ini'
    - {nome: "2003-2006", ini: "2003-01-01", fim: "2006-12-31"}
    - {nome: "2007-2012", ini: "2007-01-01", fim: "2012-12-31"}
    - {nome: "2013-2017", ini: "2013-01-01", fim: "2017-12-31"}
    - {nome: "2018-2022", ini: "2018-01-01", fim: "2022-12-31"}

caminhos:
  raw_v2: "data/raw_v2"
  processed_v2_dataset: "data/processed_v2/dataset_diario.parquet"
  resultados_v2: "reports/v2/resultados"
  processed_v2: "data/processed_v2"
  reports_eda: "reports/v2/eda"
  sar_sistema: "data/raw_v2/sar_cantareira_sistema_diario.csv"
  era5_pontos: "data/raw_v2/openmeteo_pontos_diario.csv"
  power_pontos: "data/raw_v2/nasapower_pontos_diario.csv"

# Experimento sintético (Exp 1). Semente fixa do embaralhamento da sanidade
# (modo "shuffle"): a permutação do resíduo de treino usa shuffle_seed_base + índice
# do fold, para reprodução bit a bit. Antes derivava de hash() de string, que é
# randomizado por processo (PYTHONHASHSEED) e não reproduzia o valor exato.
sintetico:
  shuffle_seed_base: 12345

# Faixas operacionais indicativas do Sistema Cantareira (volume útil %), usadas
# apenas para sombrear a figura de EDA. Valores aproximados das bandas ANA/DAEE.
faixas_ana_daee:
  - {nome: "Normal",             min: 60,  max: 100, cor: "#2ca02c"}
  - {nome: "Atenção",            min: 40,  max: 60,  cor: "#bcbd22"}
  - {nome: "Alerta",             min: 30,  max: 40,  cor: "#ff7f0e"}
  - {nome: "Restrição",          min: 20,  max: 30,  cor: "#d62728"}
  - {nome: "Reserva técnica",    min: -30, max: 20,  cor: "#7f0000"}
